[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mavflow"
version = "1.0"
description = "MAVLink connection, routing, and application protocol tools for Python."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mavlink", "autopilot", "telemetry", "asyncio", "vehicle"]
authors = [
  { name = "TahsinCr", email = "Tahsincr@outlook.com" },
]
dependencies = [
  "flowevent>=1.3.2,<2",
  "pymavlink>=2.4",
  "backports.strenum>=1.3.1,<2; python_version < '3.11'",
  "exceptiongroup>=1.3.1,<2; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/TahsinCr/python-mavflow"
Repository = "https://github.com/TahsinCr/python-mavflow"
Changelog = "https://github.com/TahsinCr/python-mavflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/TahsinCr/python-mavflow/issues"
Source = "https://github.com/TahsinCr/vehicle-autonomy-core/tree/main/mavlink"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "coverage[toml]>=7.6,<8",
  "pyperf>=2.7,<3",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mavflow*"]

[tool.setuptools.package-data]
mavflow = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".serena", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B023"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["mavflow"]
exclude = ["tests", "benchmarks", "examples"]

[tool.coverage.run]
branch = true
source = ["mavflow"]
omit = ["mavflow/_compatibility.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "@abstractmethod",
  "if TYPE_CHECKING:",
]
