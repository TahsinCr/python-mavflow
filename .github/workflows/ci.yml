name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python run_tests.py
      - name: Compile sources
        run: python -m compileall -q mavflow tests examples benchmarks run_tests.py

  quality:
    name: Lint, types, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=75
      - name: Smoke benchmark entry points
        run: |
          python -m benchmarks.benchmark_router --messages 64 --subscribers 10 --fast --processes 1 --output "$RUNNER_TEMP/mavflow-router-smoke.json"
          python -m benchmarks.benchmark_codec --payload-bytes 128 --fast --processes 1 --output "$RUNNER_TEMP/mavflow-codec-smoke.json"

  wheel:
    name: Build and verify wheel and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1,<2" "twine>=6,<7"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import mavflow; from importlib.metadata import version; assert version('mavflow') == mavflow.__version__; print(mavflow.__version__)"

  pymavlink:
    name: Real pymavlink UDP loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_pymavlink_integration -v
